name: Build and deploy

# Three ways in:
#   workflow_dispatch - the run the site relies on. cron-job.org starts it through GitHub's API
#                       at 2 AM New York time every Tuesday and Wednesday, so Monday night's and
#                       Tuesday night's results are up by morning (README.md, "The 2 AM trigger").
#                       A volunteer can also start it from the Actions tab ("Run workflow").
#   schedule          - GitHub's own cron below: the backup, and a later second pass
#   push              - republish straight away when code or archived data changes
on:
  schedule:
    # ---------------------------------------------------------------------------
    # GitHub starts these hours late. All 18 scheduled runs from September to November 2026
    # began 5 to 9.5 hours after their slot: between 8:19 AM and 11:54 AM New York time, never
    # in the small hours. GitHub delays scheduled runs when it is busy, and can drop them, and no
    # setting changes that. So the 2 AM run comes from outside (workflow_dispatch, above), and
    # these lines are the backup: if the 2 AM trigger ever stops, the site still updates the same
    # day, only later. They are also a second pass that archives any match DartConnect closes
    # after 2 AM. fetch.py skips every match already archived, so a pass with nothing new costs
    # nothing.
    #
    # GitHub cron is ALWAYS UTC and does not follow US daylight saving. 07:17 UTC is 02:17 EST
    # (early November to mid-March) and 03:17 EDT (the rest of the year): hours after the last
    # dart either way, and the hour's drift does not matter for a backup. The :17 keeps off the
    # top of the hour, GitHub's busiest minute.
    #
    # Wednesday morning, after Tuesday night's league.
    - cron: "17 7 * * 3"
    # Tuesday morning, after Monday night's league (2026-11-12).
    - cron: "17 7 * * 2"
    # Catch-up pass, Thursday at the same hour, in case GitHub drops a run: it turns a missed
    # Wednesday into a one-day delay rather than a week-long gap in the archive.
    - cron: "17 7 * * 4"
  workflow_dispatch:
  push:
    # Both names listed so this works whatever the repo's default branch is.
    # Note: commits pushed by this workflow's own GITHUB_TOKEN do NOT re-trigger
    # workflows, so the data commit below cannot start an infinite loop.
    branches: [main, master]

# Read-only by default; each job widens only what it actually needs.
permissions:
  contents: read

# One run at a time. Never cancel a run in progress: it may be mid-push of newly
# archived data, or mid-deploy to Pages.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to commit newly archived recaps back to the repo
      pages: write      # configure-pages reads/writes the Pages config
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # No requirements.txt, no pip install, no cache: the scraper and the
          # site generator are pure Python standard library, on purpose. A league
          # volunteer should be able to run this on any machine with python3.

      # ---------------------------------------------------------------------
      # 1. Fetch. Both leagues (Tuesday ParkSDL, Monday ParkSlopeDLM), every
      #    season DartConnect lists: refreshes data/seasons.json and each active
      #    season's schedule, standings and fixtures, and archives any match
      #    recap not already on disk under data/seasons/<id>/recaps/.
      #    Rate-limited to ~1.5s per recap.
      - name: Fetch new matches from DartConnect
        run: python3 scraper/fetch.py

      # ---------------------------------------------------------------------
      # 2. Commit the archive - BEFORE verification, deliberately.
      #
      #    The archive is the whole point: DartConnect owes us nothing and could
      #    change its format or withdraw access at any time. Once a payload is
      #    fetched it must be kept, even if verification then fails, otherwise a
      #    bad build throws away data we may never be able to fetch again.
      #    Committing is not publishing - the deploy below is still gated on
      #    verify.py passing.
      #
      #    always() so a partial archive survives a mid-run fetch failure.
      - name: Commit newly archived data
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          # Guard against an empty commit: most weeks nothing new has appeared.
          if git diff --cached --quiet; then
            echo "No new or changed files under data/ - nothing to commit."
          else
            git diff --cached --name-only
            git commit -m "data: archive DartConnect recaps ($(date -u '+%Y-%m-%d'))"
            git push origin HEAD:${{ github.ref_name }}
          fi

      # ---------------------------------------------------------------------
      # 3. Verify. This is the gate. verify.py exits non-zero if any assertion
      #    fails, which fails this step, which fails the job, which means the
      #    deploy job below never runs. Wrong numbers must never publish.
      - name: Verify the numbers
        run: python3 scraper/verify.py

      # ---------------------------------------------------------------------
      # 4. Build. Reads only the archive on disk, so it is offline and
      #    reproducible. Also exits non-zero if a placeholder reached a page.
      - name: Build the site
        run: python3 site/build.py

      # ---------------------------------------------------------------------
      # 5. Check the built output. verify.py gates the NUMBERS; this gates the
      #    PAGES - links, contrast, palette, fonts, heading structure, tap
      #    targets, name integrity. Also exits non-zero, so it gates the deploy
      #    the same way.
      - name: Check the built pages
        run: python3 site/check.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload public/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Summarise the run
        if: always()
        run: |
          {
            echo "### PSDL All Star build"
            echo ""
            echo "- Archived recaps: $(find data/seasons -path '*/recaps/*.json' 2>/dev/null | wc -l | tr -d ' ') across $(find data/seasons -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l | tr -d ' ') seasons"
            echo "- Generated pages: $(find public -name '*.html' 2>/dev/null | wc -l | tr -d ' ')"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    # Only reached when build succeeded, which means verify.py passed.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to prove the artifact came from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
